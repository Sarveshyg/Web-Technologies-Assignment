spring.application.name=bookstore
server.port=8080

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/bookstore_db
spring.data.mongodb.auto-index-creation=true

# JWT — override with environment variable JWT_SECRET in real deployments.
# Use a long random Base64 secret in production.
jwt.secret=${JWT_SECRET:change-this-development-secret-key-please-override-via-env}
jwt.expiration=3600000

# Do not expose passwords in logs
logging.level.org.springframework.security=WARN
