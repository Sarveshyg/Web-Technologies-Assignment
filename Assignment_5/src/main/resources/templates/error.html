<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <div class="alert alert-danger">
        <h4 class="alert-heading">Something went wrong</h4>
        <p th:text="${errorMessage != null ? errorMessage : 'The requested page could not be found.'}">Error</p>
        <a th:href="@{/}" class="btn btn-secondary btn-sm">Go Home</a>
        <a th:href="@{/results}" class="btn btn-outline-secondary btn-sm">Previous Results</a>
    </div>
</div>
</body>
</html>
