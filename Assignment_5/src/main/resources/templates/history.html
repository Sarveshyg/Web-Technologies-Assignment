<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Previous Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6fa; }
        .vit-header { background: linear-gradient(90deg, #0b3d2e, #14664f); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark vit-header">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">VIT Semester Result Calculator</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">New Result</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/results}">Previous Results</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-4">
    <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Previous Results</h4>
            <a th:href="@{/}" class="btn btn-sm btn-success">+ New Result</a>
        </div>
        <div class="card-body">
            <div th:if="${#lists.isEmpty(results)}" class="alert alert-info mb-0">
                No results saved yet. <a th:href="@{/}">Calculate your first result</a>.
            </div>

            <div th:if="${!#lists.isEmpty(results)}" class="table-responsive">
                <table class="table table-bordered table-striped align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>Student Name</th>
                        <th>PRN</th>
                        <th>Sem</th>
                        <th>Total Marks</th>
                        <th>Percentage</th>
                        <th>Result</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${results}">
                        <td th:text="${r.studentName}"></td>
                        <td th:text="${r.prn}"></td>
                        <td th:text="${r.semester}"></td>
                        <td th:text="${r.totalMarks + ' / 400'}"></td>
                        <td th:text="${r.percentage + '%'}"></td>
                        <td>
                            <span th:if="${r.resultStatus == 'PASS'}" class="badge bg-success">PASS</span>
                            <span th:if="${r.resultStatus == 'FAIL'}" class="badge bg-danger">FAIL</span>
                        </td>
                        <td th:text="${r.createdAt}"></td>
                        <td><a th:href="@{'/results/' + ${r.id}}" class="btn btn-sm btn-primary">View Result</a></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer class="text-center text-muted small py-3">VIT Pune &middot; Semester Result Calculator (student project)</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
